[package]
name = "timebridge-clock"
description = "System, fixed and manually driven clocks implementing the timebridge clock traits."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["time", "clock", "monotonic", "mock", "testing"]
categories = ["date-and-time", "development-tools::testing"]

[dependencies]
timebridge = { workspace = true, features = ["std"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid.html"]
