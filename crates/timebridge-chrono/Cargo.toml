[package]
name = "timebridge-chrono"
description = "Lossless conversions between timebridge and Chrono."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["time", "chrono", "timestamp", "conversion", "interop"]
categories = ["date-and-time", "no-std", "no-std::no-alloc"]

[dependencies]
timebridge.workspace = true
chrono.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid.html"]
