[package]
name = "timebridge"
description = "Engine-neutral temporal vocabulary for Rust library boundaries: Timestamp, ExactDuration and clock traits."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["time", "timestamp", "duration", "clock", "interop"]
categories = ["date-and-time", "no-std", "no-std::no-alloc"]

[features]
default = ["std"]
## Conversions to and from `std::time::SystemTime`.
std = []

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid.html"]
