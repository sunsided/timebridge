[package]
name = "timebridge-time"
description = "Lossless conversions between timebridge and the time crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["time", "timestamp", "conversion", "interop", "utc"]
categories = ["date-and-time", "no-std", "no-std::no-alloc"]

[dependencies]
timebridge.workspace = true
time.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid.html"]
